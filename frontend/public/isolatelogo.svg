<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 76" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradient for Top Shield Facet -->
    <linearGradient id="iso-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Gradient for Bottom-Right Shield Facet -->
    <linearGradient id="iso-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Gradient for Bottom-Left Shield Facet -->
    <linearGradient id="iso-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Gradient for Isolated Floating Core -->
    <linearGradient id="iso-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Text Gradient: High contrast on both White and Dark backgrounds -->
    <linearGradient id="iso-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="40%" stop-color="#1E40AF" />
      <stop offset="75%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="iso-core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- ISOLATE LOGOMARK (THE DIMENSIONAL HEXA-CORE)-->
  <!-- ========================================== -->
  <g transform="translate(10, 6)">
    <!-- Ambient Core Radiance / Aura -->
    <circle cx="32" cy="32" r="16" fill="url(#iso-grad-core)" opacity="0.22" filter="url(#iso-core-glow)" />

    <!-- Outer Containment Plate 1: Top (Isometric Flow) -->
    <path d="M 32 4 L 54 16.5 L 43.5 22.8 L 32 16 L 20.5 22.8 L 10 16.5 Z" fill="url(#iso-grad-top)" />

    <!-- Outer Containment Plate 2: Bottom-Right (Execution Shield) -->
    <path d="M 57 22 L 57 47 L 35.5 59.5 L 35.5 47.5 L 46.5 41 L 46.5 28.2 Z" fill="url(#iso-grad-right)" />

    <!-- Outer Containment Plate 3: Bottom-Left (Security Boundary) -->
    <path d="M 7 22 L 17.5 28.2 L 17.5 41 L 28.5 47.5 L 28.5 59.5 L 7 47 Z" fill="url(#iso-grad-left)" />

    <!-- Precision Edge Bevel Accents -->
    <path d="M 32 4 L 54 16.5 L 43.5 22.8" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.45" />
    <path d="M 57 22 L 57 47 L 35.5 59.5" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.35" />
    <path d="M 7 47 L 7 22 L 17.5 28.2" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.35" />

    <!-- The Isolated Autonomous Core: Suspended Floating Hexa-Diamond -->
    <polygon points="32,21.5 43.5,28 43.5,41.5 32,48 20.5,41.5 20.5,28" fill="url(#iso-grad-core)" filter="url(#iso-core-glow)" />
    
    <!-- Facet Faceting on the Core for 3D Gem Effect -->
    <!-- Top-Left Facet -->
    <polygon points="32,21.5 43.5,28 32,34.8 20.5,28" fill="#FFFFFF" opacity="0.32" />
    <!-- Bottom-Left Facet -->
    <polygon points="20.5,28 32,34.8 32,48 20.5,41.5" fill="#1E1B4B" opacity="0.3" />
    <!-- Bottom-Right Facet -->
    <polygon points="43.5,28 43.5,41.5 32,48 32,34.8" fill="#0C4A6E" opacity="0.25" />

    <!-- Hyper-Concentrated Spark Nucleus -->
    <circle cx="32" cy="34.8" r="3" fill="#FFFFFF" opacity="0.95" />
    <circle cx="32" cy="34.8" r="1.5" fill="#0284C7" />
  </g>

  <!-- ========================================== -->
  <!-- ISOLATE WORDMARK & TYPOGRAPHY               -->
  <!-- ========================================== -->
  <g transform="translate(86, 44)">
    <!-- Main Brand Name: Vibrant High-Contrast Gradient Visible on White and Dark -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, 'Segoe UI', sans-serif" font-size="28" font-weight="800" letter-spacing="3.5" fill="url(#iso-text-grad)">ISOLATE</text>

    <!-- Tech Status Indicator Pill / Beacon -->
    <circle cx="166" cy="-21" r="3.5" fill="url(#iso-grad-core)" />
    <circle cx="166" cy="-21" r="1.5" fill="#FFFFFF" />

    <!-- Subtitle: Autonomous Intelligence -->
    <text x="1.5" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'SF Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="2.8" fill="#475569">AUTONOMOUS WORKFLOWS</text>
  </g>
</svg>
