<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fav-grad-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="fav-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="fav-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <linearGradient id="fav-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <filter id="fav-core-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Radiance -->
  <circle cx="32" cy="32" r="18" fill="url(#fav-grad-core)" opacity="0.22" filter="url(#fav-core-glow)" />

  <!-- Outer Containment Plate 1: Top -->
  <path d="M 32 4 L 54 16.5 L 43.5 22.8 L 32 16 L 20.5 22.8 L 10 16.5 Z" fill="url(#fav-grad-top)" />

  <!-- Outer Containment Plate 2: Bottom-Right -->
  <path d="M 57 22 L 57 47 L 35.5 59.5 L 35.5 47.5 L 46.5 41 L 46.5 28.2 Z" fill="url(#fav-grad-right)" />

  <!-- Outer Containment Plate 3: Bottom-Left -->
  <path d="M 7 22 L 17.5 28.2 L 17.5 41 L 28.5 47.5 L 28.5 59.5 L 7 47 Z" fill="url(#fav-grad-left)" />

  <!-- Precision Bevel Strokes -->
  <path d="M 32 4 L 54 16.5 L 43.5 22.8" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.45" />
  <path d="M 57 22 L 57 47 L 35.5 59.5" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.35" />
  <path d="M 7 47 L 7 22 L 17.5 28.2" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.35" />

  <!-- Floating Isolated Core: Suspended Hexa-Diamond -->
  <polygon points="32,21.5 43.5,28 43.5,41.5 32,48 20.5,41.5 20.5,28" fill="url(#fav-grad-core)" filter="url(#fav-core-glow)" />

  <!-- 3D Core Gem Shading -->
  <polygon points="32,21.5 43.5,28 32,34.8 20.5,28" fill="#FFFFFF" opacity="0.35" />
  <polygon points="20.5,28 32,34.8 32,48 20.5,41.5" fill="#4338CA" opacity="0.25" />
  <polygon points="43.5,28 43.5,41.5 32,48 32,34.8" fill="#0369A1" opacity="0.25" />

  <!-- Spark Center -->
  <circle cx="32" cy="34.8" r="3.2" fill="#FFFFFF" opacity="0.95" />
  <circle cx="32" cy="34.8" r="1.6" fill="#38BDF8" />
</svg>
